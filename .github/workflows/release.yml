name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate
        run: python3 scripts/validate.py

      - name: Test
        run: python3 -m unittest discover -s tests -v

      - name: Build host ZIP archives
        run: python3 scripts/package_release.py --output dist --version-from-tag "${GITHUB_REF_NAME}"

      - name: Upload checksums
        run: |
          ls -l dist
          cat dist/SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/SHA256SUMS
            dist/SHA256SUMS.sha256
