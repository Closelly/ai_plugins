name: Materialize brand assets

on:
  push:
    paths:
      - "assets/.staging/**"
      - ".github/workflows/materialize-brand-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-brand-assets
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Decode PNG assets from staging base64
        run: |
          set -euo pipefail
          mkdir -p assets skills/mcp-business/assets
          for name in logo.png logo-dark.png icon.png icon-small.png; do
            src="assets/.staging/${name}.b64"
            test -f "$src"
            base64 -d "$src" > "assets/$name"
            cp "assets/$name" "skills/mcp-business/assets/$name"
            file "assets/$name" | grep -q "PNG image"
            echo "OK $name ($(wc -c < "assets/$name") bytes)"
          done

      - name: Commit binary assets and remove staging
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf assets/.staging
          rm -f assets/.test
          rm -f .github/workflows/materialize-brand-assets.yml
          git add -A assets skills/mcp-business/assets
          git add -u .github/workflows/materialize-brand-assets.yml assets/.test || true
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "$(cat <<'EOF'
          feat(branding): materialize Closelly colorful PNG assets

          - Replace white/non-square logo with colorful square mark
          - Mirror under skills/mcp-business/assets
          - Remove one-shot staging workflow
          EOF
          )"
          git push origin "HEAD:${GITHUB_REF_NAME}"
