name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ZIP
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="closelly-ai-plugins-${VERSION}"
          mkdir -p dist
          zip -r "dist/${NAME}.zip" . \
            -x '.git/*' \
            -x '.github/*' \
            -x 'dist/*' \
            -x '*.zip'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.zip
