interface:
  display_name: "Closelly MCP App — Crear cursos"
  short_description: "Crea, valida y publica cursos en Closelly (autoría con consentimiento explícito)"
  icon_small: "../mcp-business/assets/icon-small.png"
  icon_large: "../mcp-business/assets/logo.png"
  brand_color: "#7C3AED"
  default_prompt: "Usa /closelly o /LENA para crear o editar un curso en Closelly. Primero descubre las capacidades y el schema reales de autoría."

policy:
  allow_implicit_invocation: false

dependencies:
  tools:
    - type: "mcp"
      value: "closelly-business"
      description: "Closelly MCP Business (autoría de cursos; scopes de escritura opcionales con consentimiento explícito)"
      transport: "http"
      url: "https://auth.closelly.com/mcp/business"
