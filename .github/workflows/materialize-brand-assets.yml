name: Materialize brand assets

on:
  push:
    paths:
      - "assets/.staging/**"
      - ".github/workflows/materialize-brand-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-brand-assets
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Decode PNG assets from staging base64
        run: |
          set -euo pipefail
          mkdir -p assets skills/mcp-business/assets

          assemble() {
            local name="$1"
            local dest="assets/$name"
            local src="assets/.staging/${name}.b64"
            local p1="assets/.staging/${name}.b64.part1"
            local p2="assets/.staging/${name}.b64.part2"
            if [ -f "$src" ]; then
              base64 -d "$src" > "$dest"
            elif [ -f "$p1" ] && [ -f "$p2" ]; then
              cat "$p1" "$p2" | base64 -d > "$dest"
            elif [ "$name" = "logo-dark.png" ]; then
              # reuse logo bytes
              if [ -f assets/logo.png ]; then
                cp assets/logo.png "$dest"
                return
              fi
              echo "missing source for $name" >&2
              exit 1
            else
              echo "missing staging for $name" >&2
              exit 1
            fi
            file "$dest" | grep -q "PNG image"
            cp "$dest" "skills/mcp-business/assets/$name"
            echo "OK $name ($(wc -c < "$dest") bytes)"
          }

          assemble logo.png
          assemble logo-dark.png
          assemble icon.png
          assemble icon-small.png

      - name: Commit binary assets and remove staging
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf assets/.staging
          rm -f .github/workflows/materialize-brand-assets.yml
          git add -A assets skills/mcp-business/assets
          git add -u .github/workflows/materialize-brand-assets.yml || true
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "$(cat <<'EOF'
          feat(branding): materialize Closelly PNG logo assets

          - Decode staged base64 into real PNG binaries
          - Mirror assets under skills/mcp-business/assets
          - Remove one-shot staging workflow
          EOF
          )"
          git push origin "HEAD:${GITHUB_REF_NAME}"
