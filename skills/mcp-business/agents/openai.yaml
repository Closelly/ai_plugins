interface:
  display_name: "Closelly MCP App"
  short_description: "Consulta estudiantes, cursos, progreso y analytics de Closelly"
  icon_small: "./assets/icon-small.png"
  icon_large: "./assets/logo.png"
  brand_color: "#7C3AED"
  default_prompt: "Usa /closelly o /LENA para consultar estudiantes, cursos, progreso y analytics del tenant Closelly."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "closelly-business"
      description: "Closelly MCP Business (estudiantes, progreso, reportes, analytics, SENCE)"
      transport: "streamable_http"
      url: "https://auth.closelly.com/mcp/business"
