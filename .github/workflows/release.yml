name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from plugin.json
        id: version
        run: |
          set -euo pipefail
          VERSION="$(jq -r '.version' plugin.json)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid SemVer in plugin.json: $VERSION" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Detected plugin.json version=${VERSION}"

      - name: Check if GitHub Release already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Release $TAG does not exist; will publish."
          fi

      - name: Build ZIP
        if: steps.check.outputs.exists == 'false'
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          NAME="closelly-ai-plugins-${VERSION}"
          mkdir -p dist
          zip -r "dist/${NAME}.zip" . \
            -x '.git/*' \
            -x '.github/*' \
            -x 'dist/*' \
            -x '*.zip'

      - name: Publish GitHub Release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*.zip
